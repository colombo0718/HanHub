<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nova Nursery — Choose Your Language / Chọn Ngôn Ngữ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --blue:       #1565C0;
      --blue-light: #1976D2;
      --blue-pale:  #E3F2FD;
      --cream:      #FFF8EE;
      --text:       #1A1A2E;
      --text-sub:   #555;
      --white:      #FFFFFF;
      --radius:     16px;
      --shadow:     0 4px 20px rgba(0,0,0,0.08);
    }

    body {
      font-family: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", "Noto Sans", sans-serif;
      color: var(--text);
      background: linear-gradient(135deg, #EEF6FF 0%, var(--cream) 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    a { color: inherit; text-decoration: none; }
    img { display: block; max-width: 100%; }

    .picker {
      text-align: center;
      max-width: 480px;
    }

    .logo {
      width: 88px;
      height: 88px;
      margin: 0 auto 20px;
      filter: drop-shadow(0 8px 24px rgba(21,101,192,0.2));
    }

    h1 {
      font-size: clamp(1.6rem, 4vw, 2.2rem);
      font-weight: 800;
      margin-bottom: 40px;
      color: var(--text);
    }

    .lang-grid {
      display: flex;
      gap: 16px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .lang-btn {
      background: var(--white);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 28px 36px;
      min-width: 160px;
      font-weight: 700;
      font-size: 1.1rem;
      border: 2px solid transparent;
      transition: border-color .2s, transform .15s;
    }
    .lang-btn:hover {
      border-color: var(--blue);
      transform: translateY(-2px);
    }
    .lang-btn .flag { font-size: 2rem; display: block; margin-bottom: 10px; }
    .lang-btn .sub { display: block; font-size: 0.85rem; font-weight: 500; color: var(--text-sub); margin-top: 4px; }

    footer {
      margin-top: 48px;
      font-size: 0.8rem;
      color: var(--text-sub);
    }
  </style>
</head>
<body>

  <div class="picker">
    <img src="Card/nova-nursery_emoji.png" alt="Nova Nursery" class="logo" />
    <h1>Learn Chinese for Real Life<br />Học tiếng Trung cho Cuộc sống Thực</h1>
    <div class="lang-grid">
      <a href="/en/" class="lang-btn">
        <span class="flag">🇺🇸</span>
        English
        <span class="sub">Continue in English</span>
      </a>
      <a href="/vi/" class="lang-btn">
        <span class="flag">🇻🇳</span>
        Tiếng Việt
        <span class="sub">Tiếp tục bằng Tiếng Việt</span>
      </a>
    </div>
    <footer>© 2026 LeafLune Universe</footer>
  </div>

</body>
</html>
